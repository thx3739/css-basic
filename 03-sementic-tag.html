<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시맨틱 태그</title>
  </head>
  <body>
    <!-- 블록(block) 레벨 요소: 화면 한줄을 다 차지 -->
    <!-- 헤더 영역을 나타내는 header 태그 -->
    <!-- <header>헤더 영역</header> -->

    <!-- 네비게이션 영역을 나타내는 nav 태그 -->
    <!-- <nav>내비게이션 영역</nav> -->

    <!-- 핵심 콘텐츠를 담는 main 태그 -->
    <!-- <main>메인 영역</main> -->

    <!-- 콘텐츠 영역을 나타내는 section 태그 -->
    <!-- <section>섹션 영역</section> -->

    <!-- 푸터 영역을 나타내는 footer 태그 -->
    <!-- <footer>푸터 영역</footer> -->

    <!-- 여러 소스를 묶는 div 태그 : 이름없는 박스 -->
    <!-- <div>div 태그</div> -->

    <!-- 사용 예 -->
    <!-- 헤더 영역 -->
    <header>
      <!-- 로고 영역 -->
      <div>대한민국 구석구석</div>

      <!-- 내비게이션 영역 -->
      <nav>
        <div>여행</div>
        <div>추천</div>
        <div>테마</div>
        <div>지역</div>
        <div>디지털관광주민증</div>
      </nav>

      <!-- 유틸 영역 -->
      <div>
        <div>검색</div>
        <div>가이드</div>
        <div>통합 로그인</div>
        <div>지도</div>
        <div>언어 선택</div>
      </div>
    </header>

    <!-- 메인 영역 -->
    <main>
      <section>히어로 영역</section>
      <section>빠른메뉴 영역</section>
      <section>기사/후기 AI요약 영역</section>
      <section>홍보 배너 영역 1</section>
      <section>여행 코스 추천 영역</section>
      <section>색다른 주제 여행 영역</section>
      <section>진행중인 축제/공연/행사 영역</section>
      <section>메인 이벤트 영역</section>
      <section>홍보 배너 영역 2</section>
      <section>여행 소식 영역</section>
    </main>

    <!-- 푸터 영역 -->
    <footer>
      <div>관련 정보 영역</div>
      <div>회사 정보 및 저작권 표기 영역</div>
    </footer>
  </body>
</html>
