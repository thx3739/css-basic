<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹 문서에 다양한 내용 입력하기</title>
  </head>
  <body>
    <!-- 헤더 영역 -->
    <header>
      <!-- 로고 영역 -->
      <div>
        <!-- <h1>대한민국 구석구석</h1> -->
        <a href="#">
          <img src="assets/images/logo_big.png" alt="대한민국 구석구석" />
        </a>
      </div>

      <!-- 내비게이션 영역 -->
      <nav>
        <ul>
          <li>여행</li>
          <li>추천</li>
          <li>테마</li>
          <li>지역</li>
          <li>디지털관광주민증</li>
        </ul>
      </nav>

      <!-- 유틸 영역 -->
      <div>
        <div>검색</div>
        <div>가이드</div>
        <div>통합 로그인</div>
        <div>지도</div>
        <div>언어 선택</div>
      </div>
    </header>

    <!-- 메인 영역 -->
    <main>
      <section>
        히어로 영역
        <p>
          <strong style="font-weight: normal">가을은 깊게,</strong> <br />
          여행은 가볍게
        </p>
      </section>
      <section>
        <h2>완벽한 여행 준비를 위한 <strong>구석구석 서비스</strong></h2>
      </section>
      <section>
        <h2>
          AI가 지금 막,
          <strong>여행기사ㆍ사용자 후기를 요약했어요.</strong>
        </h2>
      </section>
      <section>홍보 배너 영역 1</section>
      <section>
        <h2>
          <strong>지금 떠나기 좋은 여행 코스 추천!</strong>
        </h2>
      </section>
      <section>
        <h2>색다른 주제로 떠나는 여행!</h2>
      </section>
      <section>
        <h2>
          진행중인
          <strong>전국의 축제ㆍ공연ㆍ행사</strong>
        </h2>
      </section>
      <section>
        <h2>이벤트</h2>
      </section>
      <section>홍보 배너 영역 2</section>
      <section>
        <h2>여행소식</h2>
      </section>
    </main>

    <!-- 푸터 영역 -->
    <footer>
      <div>관련 정보 영역</div>
      <div>회사 정보 및 저작권 표기 영역</div>
    </footer>
  </body>
</html>
